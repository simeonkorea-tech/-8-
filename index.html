<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"><title>백의천사단 동행 2026년 8월호</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f3f1ec}.newsletter{width:100%;max-width:1080px;margin:0 auto;background:#fff}.newsletter img{display:block;width:100%;height:auto;margin:0;padding:0}#musicBtn{position:fixed;right:18px;bottom:22px;z-index:9999;width:54px;height:54px;border:0;border-radius:50%;background:#c81f2b;color:#fff;font-size:24px;box-shadow:0 3px 12px rgba(0,0,0,.25);cursor:pointer}</style></head><body><main class="newsletter"><img src="1.png"><img src="2.png"><img src="3.png"><img src="4.png"><img src="5.png"><img src="6.png"><img src="7.png"><img src="8.png"><img src="9.png"></main><audio id="bgm" src="bgm.mp3" loop preload="metadata"></audio><button id="musicBtn" type="button">♪</button><script>const a=document.getElementById('bgm'),b=document.getElementById('musicBtn');b.onclick=async()=>{if(a.paused){try{await a.play();b.textContent='Ⅱ'}catch(e){}}else{a.pause();b.textContent='♪'}};</script></body></html>
